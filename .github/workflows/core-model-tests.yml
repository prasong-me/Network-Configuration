name: Core Model and Validation Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'core/model/**'
      - 'core/registry/**'
      - 'validators/**'
      - 'tests/unit/**'
      - 'scripts/test/**'
      - 'package.json'
      - '.github/workflows/core-model-tests.yml'
  pull_request:
    paths:
      - 'core/model/**'
      - 'core/registry/**'
      - 'validators/**'
      - 'tests/unit/**'
      - 'scripts/test/**'
      - 'package.json'
      - '.github/workflows/core-model-tests.yml'

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run complete test gate
        run: npm test
      - name: Run Core Model backup runner
        run: node scripts/test/run-core-model.mjs
